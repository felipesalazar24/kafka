server:
  port: 8086

spring:
  application:
    name: ms-kafka-admin
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
    admin:
      fail-fast: false
      properties:
        request.timeout.ms: 5000
        default.api.timeout.ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info